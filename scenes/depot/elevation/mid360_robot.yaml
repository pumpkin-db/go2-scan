# elevation_mapping 的输入源 + TF 配置（Go2 + Livox MID360）
# 输入：/mid360_points（传感器坐标，frame=mid360）+ TF 树 world→base→mid360
input_sources:
  mid360:
    type: pointcloud
    topic: /mid360_points
    queue_size: 1
    publish_on_update: true
    sensor_processor:
      type: perfect

# 世界系 = world（go2_kinematic_sim 发 world→base TF）
map_frame_id: "world"
robot_base_frame_id: "base"
robot_pose_with_covariance_topic: ""   # 留空 = 跳过位姿协方差更新
robot_pose_cache_size: 200

# 地图中心固定在场景中心（track_point 设成 world = map_frame，恒等变换 → 地图不跟随狗，变全局）
# Depot 场景 bbox x[-15.3,15.3] y[-7.9,7.7]，中心 (0,0)
track_point_frame_id: "world"
track_point_x: 0.0
track_point_y: 0.0
track_point_z: 0.0
